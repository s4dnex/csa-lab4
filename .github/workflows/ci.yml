name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-golden

      - name: Lint (ruff)
        run: |
          ruff check src/ test/

      - name: Type check (mypy)
        run: |
          mypy src/

      - name: Run tests
        run: |
          pytest -v