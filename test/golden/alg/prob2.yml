      push 0
      popm v_sqsum
  __while_1:
      pushm v_i
      pushm v_n
      gt
      push 0
      cmp
      beqz __endwhile_2
      pushm v_sum
      pushm v_i
      add
      popm v_sum
      pushm v_sqsum
      pushm v_i
      pushm v_i
      mul
      add
      popm v_sqsum
      pushm v_i
      push 1
      add
      popm v_i
      jump __while_1
  __endwhile_2:
      pushm v_sum
      pushm v_sum
      mul
      pushm v_sqsum
      sub
      popm v_result
      pushm v_result
      popm 65535
      push 10
      popm 65534
      halt
