in_source: |
  func banner() {
      print("=== alg demo ===\n");
  }

  banner();

  // branching with comparison and else
  let x = 7;
  if (x % 2 == 0) {
      print("even\n");
  } else {
      print("odd\n");
  }

  // nested arithmetic with precedence
  let y = 2 + 3 * (x - 1);
  print("y = ");
  print(y);
  putc(10);

  // countdown loop
  let n = 5;
  while (n > 0) {
      print(n);
      putc(32);
      n = n - 1;
  }
  putc(10);
output: |
  Output:       === alg demo ===
                odd
                y = 20
                5 4 3 2 1 

  Ticks:        1136
  Instructions: 417
asm: |
  .data
  v_x: .word 0
  v_y: .word 0
  v_n: .word 0
  __sp: .word 0
  __str_3: .str "even\n"
  __str_4: .str "odd\n"
  __str_5: .str "y = "
  __str_8: .str "=== alg demo ===\n"

  .text
  _start:
      call f_banner
      push 7
      popm v_x
      pushm v_x
      push 2
      mod
      push 0
      cmp
      beqz __else_1
      push __str_3
      call __print_str
      jump __endif_2
  __else_1:
      push __str_4
      call __print_str
  __endif_2:
      push 2
      push 3
      pushm v_x
      push 1
      sub
      mul
      add
      popm v_y
      push __str_5
      call __print_str
      pushm v_y
      popm 65535
      push 10
      popm 65534
      push 5
      popm v_n
  __while_6:
      pushm v_n
      push 0
      gt
      beqz __endwhile_7
      pushm v_n
      popm 65535
      push 32
      popm 65534
      pushm v_n
      push 1
      sub
      popm v_n
      jump __while_6
  __endwhile_7:
      push 10
      popm 65534
      halt
  f_banner:
      push __str_8
      call __print_str
      ret
  __print_str:
      popm __sp
  __print_str_loop:
      pushm __sp
      pushi
      beqz __print_str_end
      push 65534
      pushm __sp
      pushi
      popi
      pushm __sp
      push 1
      add
      popm __sp
      jump __print_str_loop
  __print_str_end:
      ret
