  .data
  .org 0x20
  message_add:    .str "4294967295 + 2 = "
  message_sub:    .str "4294967297 - 2 = "
  message_mul:    .str "100000 * 100000 = "
  sep:            .str " "

  a_hi:           .word 0
  a_lo:           .word -1
  b_hi:           .word 0
  b_lo:           .word 2

  c_hi:           .word 1
  c_lo:           .word 1
  d_hi:           .word 0
